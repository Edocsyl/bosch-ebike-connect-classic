name: CI

# Runs only when code, the image definition or the pipelines change (not for README / docs edits).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health check, /mcp without token answers 401, OAuth metadata)
        run: |
          # no environment at all: secret is generated, PUBLIC_URL defaults to localhost
          docker run -d --name smoke -p 8080:8080 smoke:test
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          test "$(curl -fsS http://localhost:8080/healthz)" = "ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp)" = "401"
          curl -fsS http://localhost:8080/.well-known/oauth-authorization-server | grep -q '"issuer"'
          docker logs smoke
          docker rm -f smoke
