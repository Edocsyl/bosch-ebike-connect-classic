[project]
name = "bosch-ebike-connect-classic"
version = "1.1.0"
description = "Multi-user, OAuth 2.1 protected remote MCP server for the Bosch eBike Connect (Classic) portal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23.0,<2",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "cryptography>=42",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
bosch-ebike-connect-classic = "bosch_ebike_connect_classic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosch_ebike_connect_classic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
